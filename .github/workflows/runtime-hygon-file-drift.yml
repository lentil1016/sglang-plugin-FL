# Temporary file-level zero-drift probe. Do not merge into the product branch.
# Compares the operations runtime BASE image against the built FINAL image at
# file level: every file present in BASE (under the python site-packages trees
# and /opt/flagtree) must exist in FINAL with the identical sha256. Files only
# present in FINAL are additions (pip-installed application closure) and are
# reported, not failed. __pycache__/*.pyc artifacts are excluded: they are
# legitimately (re)generated by interpreter runs and are not source drift.
name: Hygon runtime file-level zero-drift (temp probe)

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full final image ref with digest (repo@sha256:...)"
        required: true
        type: string

permissions:
  contents: read

env:
  BASE_IMAGE: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-hygon-dtk26.04@sha256:03e598b348e58e7233628394bbefa0ccef26969a091c7e6f2f02835161757f8b

jobs:
  file-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Hash BASE image trees
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          mkdir -p drift/base drift/final
          docker run --rm -i -v "$PWD/drift/base:/out" --entrypoint /bin/bash \
            "$BASE_IMAGE" -s <<'EOF'
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import sysconfig
          from pathlib import Path

          def hash_tree(root: Path):
              out = {}
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.is_symlink():
                      continue
                  rel = str(p.relative_to(root))
                  if "__pycache__" in p.parts or p.suffix == ".pyc":
                      continue
                  h = hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda: f.read(1 << 20), b""):
                          h.update(chunk)
                  out[rel] = h.hexdigest()
              return out

          result = {}
          pure = Path(sysconfig.get_paths()["purelib"])
          plat = Path(sysconfig.get_paths()["platlib"])
          trees = {"purelib": pure}
          if plat != pure:
              trees["platlib"] = plat
          flagtree = Path("/opt/flagtree")
          if flagtree.is_dir():
              trees["opt_flagtree"] = flagtree
          for name, root in trees.items():
              files = hash_tree(root)
              result[name] = {"root": str(root), "files": files}
              print(f"{name}: {len(files)} files hashed under {root}")
          Path("/out/trees.json").write_text(json.dumps(result))
          PY
          EOF

      - name: Hash FINAL image trees
        run: |
          set -euo pipefail
          docker pull "${{ inputs.image }}"
          docker run --rm -i -v "$PWD/drift/final:/out" --entrypoint /bin/bash \
            "${{ inputs.image }}" -s <<'EOF'
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import sysconfig
          from pathlib import Path

          def hash_tree(root: Path):
              out = {}
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.is_symlink():
                      continue
                  rel = str(p.relative_to(root))
                  if "__pycache__" in p.parts or p.suffix == ".pyc":
                      continue
                  h = hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda: f.read(1 << 20), b""):
                          h.update(chunk)
                  out[rel] = h.hexdigest()
              return out

          result = {}
          pure = Path(sysconfig.get_paths()["purelib"])
          plat = Path(sysconfig.get_paths()["platlib"])
          trees = {"purelib": pure}
          if plat != pure:
              trees["platlib"] = plat
          flagtree = Path("/opt/flagtree")
          if flagtree.is_dir():
              trees["opt_flagtree"] = flagtree
          for name, root in trees.items():
              files = hash_tree(root)
              result[name] = {"root": str(root), "files": files}
              print(f"{name}: {len(files)} files hashed under {root}")
          Path("/out/trees.json").write_text(json.dumps(result))
          PY
          EOF

      - name: Compare trees (zero drift on BASE-present files)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("drift/base/trees.json").read_text())
          final = json.loads(Path("drift/final/trees.json").read_text())

          assert set(base) == set(final), \
              f"tree roots differ: {set(base) ^ set(final)}"

          total_changed, total_missing, total_added = [], [], []
          for tree in sorted(base):
              b = base[tree]["files"]
              f = final[tree]["files"]
              changed = sorted(p for p in b if p in f and b[p] != f[p])
              missing = sorted(p for p in b if p not in f)
              added = sorted(p for p in f if p not in b)
              print(f"[{tree}] base={len(b)} final={len(f)} "
                    f"changed={len(changed)} missing={len(missing)} added={len(added)}")
              for p in changed[:20]:
                  print(f"  CHANGED {tree}/{p}")
              for p in missing[:20]:
                  print(f"  MISSING {tree}/{p}")
              total_changed += [f"{tree}/{p}" for p in changed]
              total_missing += [f"{tree}/{p}" for p in missing]
              total_added += [f"{tree}/{p}" for p in added]

          Path("drift/added-files.txt").write_text("\n".join(total_added))
          if total_changed or total_missing:
              raise SystemExit(
                  f"FILE DRIFT: {len(total_changed)} changed, "
                  f"{len(total_missing)} missing (see log)")
          print(f"ZERO FILE DRIFT on base-present files; "
                f"{len(total_added)} added files (application closure)")
          PY

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hygon-file-drift
          path: drift/
          if-no-files-found: warn
          retention-days: 7

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
