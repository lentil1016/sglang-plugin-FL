# Temporary image build workflow. Do not merge this workflow into the product branch.
name: Build Hygon application-fixed runtime CI image

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = full build+push+verify; verify = post-hoc verification only"
        required: false
        default: build
        type: string
      image:
        description: "Full final image ref with digest (verify mode only)"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_REPO: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl
  IMAGE_TAG: 0.5.18-hygon-runtime-ci-20261112-appfix3
  CONTAINERFILE: docker/hygon/runtime-0.5.18.containerfile

jobs:
  build-push-verify:
    if: inputs.mode != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out image inputs
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          sparse-checkout: |
            docker/hygon/

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Build
        run: |
          set -euo pipefail
          export DOCKER_BUILDKIT=1
          docker build \
            -f "$CONTAINERFILE" \
            -t "${IMAGE_REPO}:${IMAGE_TAG}" \
            --provenance=false \
            .

      # Fast path: plain docker push. Cross-ocean large-blob uploads stall
      # indefinitely (observed: a ~600MB layer made zero progress in 6x45min
      # bounded attempts while every other layer crossed in minutes), and a
      # stalled push never exits on its own, so bound it. On failure fall back
      # to chunked registry upload below.
      - name: Push (fast path, bounded)
        id: fast_push
        run: |
          set -euo pipefail
          if timeout 20m docker push "${IMAGE_REPO}:${IMAGE_TAG}"; then
            echo "pushed=fast" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "fast-path push did not finish in 20m (rc=$rc); using chunked fallback" >&2
            echo "pushed=chunked" >> "$GITHUB_OUTPUT"
          fi

      # Fallback: docker pushes the image to a LOCAL registry (seconds), then
      # a python uploader moves each missing blob to harbor in 16MB PATCH
      # chunks - each chunk has its own timeout and retries, so an idle
      # cross-ocean connection only loses one chunk instead of the whole
      # monolithic upload. The manifest bytes are PUT verbatim from the local
      # registry, so the pushed digest is exactly what docker push would have
      # produced.
      - name: Push (chunked fallback)
        if: steps.fast_push.outputs.pushed == 'chunked'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          docker run -d --name localreg -p 5000:5000 registry:2
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/v2/ >/dev/null 2>&1 && break
            sleep 2
          done
          LOCAL_NAME="localhost:5000/${IMAGE_REPO#*/}"
          docker tag "${IMAGE_REPO}:${IMAGE_TAG}" "$LOCAL_NAME:${IMAGE_TAG}"
          docker push "$LOCAL_NAME:${IMAGE_TAG}"
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          HARBOR = "https://harbor.baai.ac.cn"
          LOCAL = "http://localhost:5000"
          name = os.environ["IMAGE_REPO"].split("/", 1)[1]
          tag = os.environ["IMAGE_TAG"]
          token = base64.b64encode(
              f'{os.environ["HARBOR_USERNAME"]}:{os.environ["HARBOR_PASSWORD"]}'.encode()
          ).decode()

          def req(url, method="GET", data=None, headers=None, timeout=240):
              h = {"Authorization": f"Basic {token}", **(headers or {})}
              r = urllib.request.Request(url, data=data, headers=h, method=method)
              return urllib.request.urlopen(r, timeout=timeout)

          def harbor_path(path):
              return path if path.startswith("http") else HARBOR + path

          accept = ", ".join([
              "application/vnd.docker.distribution.manifest.v2+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.oci.image.index.v1+json",
          ])
          with req(f"{LOCAL}/v2/{name}/manifests/{tag}", headers={"Accept": accept}) as r:
              manifest_bytes = r.read()
              manifest_digest = r.headers.get("Docker-Content-Digest")
              manifest_type = r.headers.get("Content-Type")
          print(f"manifest: {manifest_digest} ({manifest_type})")

          m = json.loads(manifest_bytes)
          blobs = [l["digest"] for l in m.get("layers", [])] + [m.get("config", {}).get("digest") if isinstance(m.get("config"), dict) else m.get("config")]

          deadline = time.time() + 165 * 60
          chunk = 16 << 20
          for digest in blobs:
              digest = digest.removeprefix("sha256:")
              try:
                  with req(harbor_path(f"/v2/{name}/blobs/sha256:{digest}"), method="HEAD") as r:
                      if r.status == 200:
                          print(f"blob sha256:{digest[:12]} exists, skip")
                          continue
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              with req(f"{LOCAL}/v2/{name}/blobs/sha256:{digest}") as r:
                  blob = r.read()
              size = len(blob)
              t0 = time.time()
              print(f"blob sha256:{digest[:12]}: {size/1e6:.1f} MB to upload")
              for attempt in range(3):
                  try:
                      with req(harbor_path(f"/v2/{name}/blobs/uploads/"), method="POST") as r:
                          location = r.headers["Location"]
                      sent = 0
                      while sent < size:
                          if time.time() > deadline:
                              raise SystemExit("chunked upload deadline exceeded")
                          end = min(sent + chunk, size)
                          piece = blob[sent:end]
                          h = {
                              "Content-Length": str(len(piece)),
                              "Content-Range": f"{sent}-{end - 1}",
                              "Content-Type": "application/octet-stream",
                          }
                          ct0 = time.time()
                          with req(harbor_path(location), method="PATCH", data=piece, headers=h) as r:
                              location = r.headers.get("Location", location)
                          rate = len(piece) / max(time.time() - ct0, 1e-3)
                          print(f"  chunk {sent//(1<<20)}-{end//(1<<20)}MB "
                                f"({rate/1e6:.2f} MB/s)", flush=True)
                          sent = end
                      put_url = harbor_path(location)
                      sep = "&" if "?" in put_url else "?"
                      with req(f"{put_url}{sep}digest=sha256:{digest}", method="PUT") as r:
                          assert r.status in (201, 202), f"unexpected PUT status {r.status}"
                      dt = time.time() - t0
                      print(f"blob sha256:{digest[:12]}: done "
                            f"({size/1e6:.1f} MB in {dt:.0f}s = {size/dt/1e6:.2f} MB/s)")
                      break
                  except Exception as e:
                      print(f"  attempt {attempt + 1} failed: {e!r}; restarting blob", flush=True)
              else:
                  raise SystemExit(f"blob sha256:{digest[:12]} failed after 3 attempts")

          put = req(
              harbor_path(f"/v2/{name}/manifests/{tag}"),
              method="PUT",
              data=manifest_bytes,
              headers={"Content-Type": manifest_type},
          )
          with put:
              assert put.status == 201, f"manifest PUT status {put.status}"
          print(f"manifest PUT ok: {manifest_digest}")
          PY
          docker rm -f localreg

      - name: Record immutable digest
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect \
            "${IMAGE_REPO}:${IMAGE_TAG}" \
            --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "unexpected digest: $digest" >&2; exit 1 ;;
          esac
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          printf 'image=%s@%s\n' "$IMAGE_REPO" "$digest" | tee image-digest.txt

      - name: Verify application patch and Runtime preservation
        run: |
          set -euo pipefail
          image="${IMAGE_REPO}@${IMAGE_DIGEST}"
          docker pull "$image"
          mkdir -p verify-output
          docker run --rm -i \
            -v "$PWD/verify-output:/verify" \
            --entrypoint /bin/bash \
            "$image" -s <<'EOF'
          set -euo pipefail
          cp -a /opt/sglang-ci/. /verify/
          python - <<'PY'
          import importlib.metadata as md
          import json
          import sysconfig
          from pathlib import Path

          root = Path(sysconfig.get_paths()["purelib"])
          expected = {
              "sglang/srt/layers/quantization/quark/schemes/quark_w4a4_mxfp4.py": (
                  "if _is_hip and not _is_hcu:"
              ),
              "sglang/srt/layers/quantization/quark/schemes/quark_w4a4_mxfp4_moe.py": (
                  "_use_aiter = get_bool_env_var(\"SGLANG_USE_AITER\") and _is_hip and not _is_hcu"
              ),
              "sglang/srt/layers/quantization/quark_int4fp8_moe.py": (
                  "if _is_hip and not _is_hcu:"
              ),
              "sglang/srt/layers/attention/triton_backend.py": (
                  "if _is_cuda and not _is_hcu:"
              ),
              "sglang/srt/layers/activation.py": (
                  "alias the sgl fallbacks to the Triton"
              ),
              "sglang/srt/layers/layernorm.py": (
                  "HCU ships no sgl_kernel wheel"
              ),
              "sglang/srt/layers/sampler.py": (
                  "HCU ships neither flashinfer nor sgl_kernel"
              ),
          }
          for relative, marker in expected.items():
              source = (root / relative).read_text(encoding="utf-8")
              if marker not in source:
                  raise SystemExit(f"HCU application patch marker missing: {relative}")
              compile(source, relative, "exec")
              print("patched:", relative)

          before = json.loads(Path("/opt/sglang-ci/runtime-distributions-before.json").read_text())
          after = json.loads(Path("/opt/sglang-ci/runtime-distributions-after.json").read_text())
          drift = {name: (version, after.get(name)) for name, version in before.items()
                   if after.get(name) != version}
          if drift:
              raise SystemExit(f"Runtime distribution drift: {drift}")
          print("sglang:", md.version("sglang"))
          print("runtime distributions preserved:", len(before))
          print("application additions:", len(set(after) - set(before)))
          print("patch evidence:", Path("/opt/sglang-ci/sglang-hcu-patch.sha256").read_text().strip())
          PY
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hygon-application-fixed-image
          path: |
            verify-output/
            image-digest.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true

  # Post-hoc verification of an already-pushed image: file-level zero-drift
  # against the operations runtime base plus application metadata checks
  # (aiter absence, triton distribution identity). Hardware-dependent checks
  # live in the temporary flagos-ai hardware-evidence PR.
  verify-image:
    if: inputs.mode == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FINAL_IMAGE: ${{ inputs.image }}
      BASE_IMAGE: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-hygon-dtk26.04@sha256:03e598b348e58e7233628394bbefa0ccef26969a091c7e6f2f02835161757f8b
    steps:
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Hash BASE and FINAL trees
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          docker pull "$FINAL_IMAGE"
          mkdir -p drift/base drift/final
          for side in base final; do
            if [ "$side" = base ]; then IMG="$BASE_IMAGE"; else IMG="$FINAL_IMAGE"; fi
            docker run --rm -i -v "$PWD/drift/$side:/out" --entrypoint /bin/bash \
              "$IMG" -s <<'EOF'
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import sysconfig
          from pathlib import Path

          def hash_tree(root):
              out = {}
              for p in sorted(root.rglob("*")):
                  if not p.is_file() or p.is_symlink():
                      continue
                  if "__pycache__" in p.parts or p.suffix == ".pyc":
                      continue
                  h = hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda: f.read(1 << 20), b""):
                          h.update(chunk)
                  out[str(p.relative_to(root))] = h.hexdigest()
              return out

          pure = Path(sysconfig.get_paths()["purelib"])
          plat = Path(sysconfig.get_paths()["platlib"])
          trees = {"purelib": pure}
          if plat != pure:
              trees["platlib"] = plat
          if Path("/opt/flagtree").is_dir():
              trees["opt_flagtree"] = Path("/opt/flagtree")
          result = {}
          for name, root in trees.items():
              files = hash_tree(root)
              result[name] = {"root": str(root), "files": files}
              print(f"{name}: {len(files)} files hashed")
          Path("/out/trees.json").write_text(json.dumps(result))
          PY
          EOF
          done

      - name: Application metadata checks (hosted subset)
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint /bin/bash "$FINAL_IMAGE" -s <<'EOF'
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata as md
          names = sorted({(d.metadata["Name"] or "").lower() for d in md.distributions()})
          aiter_like = [n for n in names if "aiter" in n]
          print("distributions total:", len(names))
          print("aiter-like distributions:", aiter_like)
          assert not aiter_like, f"aiter distributions present: {aiter_like}"
          try:
              print("triton distribution version:", md.version("triton"))
          except md.PackageNotFoundError:
              print("triton distribution version: <none>")
          print("sglang:", md.version("sglang"))
          PY
          EOF

      - name: Compare trees (zero drift on BASE-present files)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("drift/base/trees.json").read_text())
          final = json.loads(Path("drift/final/trees.json").read_text())
          assert set(base) == set(final), f"tree roots differ: {set(base) ^ set(final)}"
          total_changed, total_missing, total_added = [], [], []
          for tree in sorted(base):
              b = base[tree]["files"]
              f = final[tree]["files"]
              changed = sorted(p for p in b if p in f and b[p] != f[p])
              missing = sorted(p for p in b if p not in f)
              added = sorted(p for p in f if p not in b)
              print(f"[{tree}] base={len(b)} final={len(f)} "
                    f"changed={len(changed)} missing={len(missing)} added={len(added)}")
              for p in changed[:20]:
                  print(f"  CHANGED {tree}/{p}")
              for p in missing[:20]:
                  print(f"  MISSING {tree}/{p}")
              total_changed += [f"{tree}/{p}" for p in changed]
              total_missing += [f"{tree}/{p}" for p in missing]
              total_added += [f"{tree}/{p}" for p in added]
          Path("drift/added-files.txt").write_text("\n".join(total_added))
          if total_changed or total_missing:
              raise SystemExit(f"FILE DRIFT: {len(total_changed)} changed, {len(total_missing)} missing")
          print(f"ZERO FILE DRIFT on base-present files; {len(total_added)} added files")
          PY

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hygon-file-drift
          path: drift/
          if-no-files-found: warn
          retention-days: 7

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
