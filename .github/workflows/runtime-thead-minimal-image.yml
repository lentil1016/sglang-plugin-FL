# Temporary image build helper on the fork default branch. Do not merge into
# the product repository.
name: Build minimal T-Head runtime CI image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Fork branch containing the T-Head Containerfile"
        required: true
        default: "ci/thead-runtime-minimal-probe"
      image_tag:
        description: "Tag under flagos-dev/sglang-plugin-fl"
        required: true
        default: "0.5.18-thead-runtime-minimal-20261110"
      containerfile:
        description: "Containerfile path on source_ref"
        required: true
        default: "docker/thead/ci-runtime-0.5.18.containerfile"
      base_image:
        description: "BASE_IMAGE build-arg override (empty = containerfile default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-push-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out image source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: lentil1016/sglang-plugin-FL
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HARBOR_USERNAME"
          test -n "$HARBOR_PASSWORD"
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
                 --username "$HARBOR_USERNAME" --password-stdin; then
              break
            fi
            test "$attempt" -lt 5
            sleep 15
          done

      - name: Inspect base image inventory
        run: |
          set -euo pipefail
          base="${BASE_IMAGE:-}"
          if [ -z "$base" ]; then
            base="$(sed -n 's/^ARG BASE_IMAGE=//p' "$CONTAINERFILE" | head -1)"
          fi
          echo "base image: $base"
          mkdir -p inspect-output
          docker pull "$base"
          docker run --rm --entrypoint /bin/bash "$base" -s <<'EOF' | tee inspect-output/base-inventory.txt
          set -uo pipefail
          echo "=== which python/pip ==="
          which python python3 pip pip3 || true
          echo "=== python layout ==="
          python - <<'PY'
          import sys, sysconfig
          print("executable:", sys.executable)
          print("version:", sys.version)
          print("purelib:", sysconfig.get_paths()["purelib"])
          print("sys.path:")
          for p in sys.path:
              print("  ", p)
          PY
          echo "=== full distribution inventory ==="
          python - <<'PY'
          import importlib.metadata as md
          seen = {}
          for d in md.distributions():
              name = d.metadata.get("Name")
              if name:
                  prev = seen.setdefault(name.lower(), (name, d.version))
                  if prev[1] != d.version:
                      print("DUPLICATE:", name, prev[1], d.version)
          for k in sorted(seen):
              print(f"{seen[k][0]}=={seen[k][1]}")
          PY
          echo "=== triton module resolution (bare) ==="
          python - <<'PY'
          try:
              import triton
              print("triton:", triton.__file__)
          except Exception as e:
              print("triton import failed:", repr(e))
          PY
          echo "=== torch / torchvision / torchaudio imports (no device) ==="
          python - <<'PY'
          for mod in ("torch", "torchvision", "torchaudio"):
              try:
                  m = __import__(mod)
                  print(mod + ":", getattr(m, "__version__", "?"))
              except Exception as e:
                  print(mod + " import failed:", repr(e))
          PY
          echo "=== /opt and /flagos layout ==="
          ls /opt || true
          ls /flagos 2>/dev/null || echo "no /flagos"
          ls /opt/flagtree 2>/dev/null | head -12 || echo "no /opt/flagtree"
          ls /usr/local/PPU_SDK 2>/dev/null || echo "no /usr/local/PPU_SDK"
          EOF
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          CONTAINERFILE: ${{ inputs.containerfile }}

      - name: Build and push image
        env:
          IMAGE_REPO: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl
          IMAGE_TAG: ${{ inputs.image_tag }}
          CONTAINERFILE: ${{ inputs.containerfile }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          image="${IMAGE_REPO}:${IMAGE_TAG}"
          base_arg=()
          if [ -n "$BASE_IMAGE" ]; then
            base_arg=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")
          fi
          docker buildx use default
          docker buildx inspect default --bootstrap
          docker buildx build \
            --builder default \
            --file "$CONTAINERFILE" \
            "${base_arg[@]}" \
            --tag "$image" \
            --cache-from "type=registry,ref=$image" \
            --cache-to type=inline \
            --push \
            --provenance=false \
            --metadata-file build-metadata.json \
            .
          digest="$(python3 -c "import json; print(json.load(open('build-metadata.json'))['containerimage.digest'])")"
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          echo "IMAGE=${IMAGE_REPO}@${digest}" >> "$GITHUB_ENV"
          printf '%s\n' "${IMAGE_REPO}@${digest}" | tee image-digest.txt

      - name: Verify runtime preservation and added closure
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --entrypoint /bin/bash "$IMAGE" -c '
            set -euo pipefail
            test -s /opt/runtime-distributions.before
            test -s /opt/runtime-constraints.txt
            test -s /opt/sglang-added-distributions.txt
            cat /opt/sglang-added-distributions.txt
            python -c "import importlib.metadata as m; assert m.version(\"sglang\") == \"0.5.18\""
          '

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thead-minimal-runtime-image
          path: |
            image-digest.txt
            build-metadata.json
            inspect-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
