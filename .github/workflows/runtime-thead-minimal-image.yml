# Temporary image build helper on the fork default branch. Do not merge into
# the product repository.
name: Build minimal T-Head runtime CI image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Fork branch containing the T-Head Containerfile"
        required: true
        default: "ci/thead-runtime-minimal-probe"
      image_tag:
        description: "Tag under flagos-dev/sglang-plugin-fl"
        required: true
        default: "0.5.18-thead-runtime-minimal-20261110"
      containerfile:
        description: "Containerfile path on source_ref"
        required: true
        default: "docker/thead/ci-runtime-0.5.18.containerfile"
      base_image:
        description: "BASE_IMAGE build-arg override (empty = containerfile default)"
        required: false
        default: ""
      verify_only:
        description: "Skip inspect/build and only verify image_digest"
        required: false
        default: false
      image_digest:
        description: "Image digest (repo@sha256:...) for verify_only mode"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-push-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Check out image source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: lentil1016/sglang-plugin-FL
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HARBOR_USERNAME"
          test -n "$HARBOR_PASSWORD"
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$HARBOR_PASSWORD" | docker login harbor.baai.ac.cn \
                 --username "$HARBOR_USERNAME" --password-stdin; then
              break
            fi
            test "$attempt" -lt 5
            sleep 15
          done

      - name: Inspect base image inventory
        if: ${{ inputs.verify_only != true }}
        run: |
          set -euo pipefail
          base="${BASE_IMAGE:-}"
          if [ -z "$base" ]; then
            base="$(sed -n 's/^ARG BASE_IMAGE=//p' "$CONTAINERFILE" | head -1)"
          fi
          echo "base image: $base"
          mkdir -p inspect-output
          docker pull "$base"
          docker run --rm -i --entrypoint /bin/bash "$base" -s <<'EOF' | tee inspect-output/base-inventory.txt
          set -uo pipefail
          echo "=== which python/pip ==="
          which python python3 pip pip3 || true
          echo "=== python layout ==="
          python - <<'PY'
          import sys, sysconfig
          print("executable:", sys.executable)
          print("version:", sys.version)
          print("purelib:", sysconfig.get_paths()["purelib"])
          print("sys.path:")
          for p in sys.path:
              print("  ", p)
          PY
          echo "=== full distribution inventory ==="
          python - <<'PY'
          import importlib.metadata as md
          seen = {}
          for d in md.distributions():
              name = d.metadata.get("Name")
              if name:
                  norm = name.lower().replace("_", "-")
                  prev = seen.setdefault(norm, (name, d.version))
                  if prev[1] != d.version:
                      print("DUPLICATE:", name, prev[1], d.version)
          for k in sorted(seen):
              print(f"{seen[k][0]}=={seen[k][1]}")
          # Contract from the handoff (build-infra PR #1738, issue #1730):
          # fail before building if the runtime contents drift from the
          # documented vendor stack.
          expected = {
              "torch": "2.10.0+v0.1.0.ppu2.1.1",
              "torchvision": "0.25.0+v0.1.0.ppu2.1.1",
              "torchaudio": "2.10.0+v0.1.0.ppu2.1.1",
              "flagtree": "0.7.0+ppu3.6",
              "flag-gems": "5.4.0",
              "numpy": "1.26.4",
          }
          missing = []
          wrong = []
          for norm, want in expected.items():
              if norm not in seen:
                  missing.append(f"{norm} (want {want})")
              elif seen[norm][1] != want:
                  wrong.append(f"{norm}: {seen[norm][1]} (want {want})")
          if missing or wrong:
              raise SystemExit("base image contract violated: "
                               + "; ".join(missing + wrong))
          print("base image vendor contract: OK")
          PY
          echo "=== triton module resolution (bare) ==="
          python - <<'PY'
          try:
              import triton
              print("triton:", triton.__file__)
          except Exception as e:
              print("triton import failed:", repr(e))
          PY
          echo "=== torch / torchvision / torchaudio import matrix (no device) ==="
          python - <<'PY'
          import os, subprocess, sys, traceback
          combos = {
              "bare": {},
              "pyp": {"PYTHONPATH": "/opt/flagtree"},
              "accl": {"LD_LIBRARY_PATH": "/opt/accl-p"},
              "both": {"PYTHONPATH": "/opt/flagtree",
                       "LD_LIBRARY_PATH": "/opt/accl-p"},
          }
          for name, extra in combos.items():
              env = dict(os.environ)
              if "LD_LIBRARY_PATH" in extra:
                  env["LD_LIBRARY_PATH"] = extra["LD_LIBRARY_PATH"] + ":" + env.get("LD_LIBRARY_PATH", "")
              env.update({k: v for k, v in extra.items() if k != "LD_LIBRARY_PATH"})
              for mod in ("torch", "torchvision", "torchaudio"):
                  code = f"import {mod}; print('{mod}', getattr(__import__('{mod}'), '__version__', '?'))"
                  r = subprocess.run([sys.executable, "-c", code],
                                     env=env, capture_output=True, text=True)
                  if r.returncode == 0:
                      print(f"combo {name}: {r.stdout.strip()}")
                  else:
                      last = r.stderr.strip().splitlines()[-1] if r.stderr.strip() else "?"
                      print(f"combo {name}: {mod} import FAILED: {last}")
          ok = []
          for name, extra in combos.items():
              env = dict(os.environ)
              env.update(extra)
              r = subprocess.run([sys.executable, "-c", "import torchvision"],
                                 env=env, capture_output=True, text=True)
              if r.returncode == 0:
                  ok.append(name)
          if not ok:
              print("VENDOR_TORCHVISION_IMPORT_BROKEN_IN_BASE (all combos failed)")
          else:
              print("VENDOR_TORCHVISION_IMPORT_OK_WITH:", ",".join(ok))
          PY
          echo "=== vision/audio shared library diagnosis ==="
          for lib in /flagos/lib/python3.12/site-packages/torchvision/lib/*.so* \
                     /flagos/lib/python3.12/site-packages/torchaudio/lib/*.so*; do
            [ -e "$lib" ] || continue
            missing="$(ldd "$lib" 2>&1 | grep "not found" || true)"
            if [ -n "$missing" ]; then
              echo "--- $(basename "$lib") MISSING:"
              echo "$missing"
            else
              echo "--- $(basename "$lib"): all NEEDED libs resolve"
            fi
          done
          echo "=== /opt and /flagos layout ==="
          ls /opt || true
          ls /flagos 2>/dev/null || echo "no /flagos"
          ls /opt/flagtree 2>/dev/null | head -12 || echo "no /opt/flagtree"
          ls /usr/local/PPU_SDK 2>/dev/null || echo "no /usr/local/PPU_SDK"
          echo "=== inspect done ==="
          EOF
          test -s inspect-output/base-inventory.txt
          grep -q "base image vendor contract: OK" inspect-output/base-inventory.txt
          if grep -q "VENDOR_TORCHVISION_IMPORT_BROKEN_IN_BASE" inspect-output/base-inventory.txt; then
            echo "::warning::vendor torchvision does not import on a device-less runner (expected for PPU-linked builds); hardware validation must cover it"
          fi
        env:
          BASE_IMAGE: ${{ inputs.base_image }}
          CONTAINERFILE: ${{ inputs.containerfile }}

      - name: Build and push image
        if: ${{ inputs.verify_only != true }}
        env:
          IMAGE_REPO: harbor.baai.ac.cn/flagos-dev/sglang-plugin-fl
          IMAGE_TAG: ${{ inputs.image_tag }}
          CONTAINERFILE: ${{ inputs.containerfile }}
          BASE_IMAGE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          image="${IMAGE_REPO}:${IMAGE_TAG}"
          base_arg=()
          if [ -n "$BASE_IMAGE" ]; then
            base_arg=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")
          fi
          docker buildx use default
          docker buildx inspect default --bootstrap
          docker buildx build \
            --builder default \
            --file "$CONTAINERFILE" \
            "${base_arg[@]}" \
            --tag "$image" \
            --cache-from "type=registry,ref=$image" \
            --cache-to type=inline \
            --push \
            --provenance=false \
            --metadata-file build-metadata.json \
            .
          digest="$(python3 -c "import json; print(json.load(open('build-metadata.json'))['containerimage.digest'])")"
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          echo "IMAGE=${IMAGE_REPO}@${digest}" >> "$GITHUB_ENV"
          printf '%s\n' "${IMAGE_REPO}@${digest}" | tee image-digest.txt

      - name: Verify runtime preservation and added closure
        env:
          IMAGE_DIGEST_INPUT: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGE_DIGEST_INPUT" ]; then
            IMAGE="$IMAGE_DIGEST_INPUT"
          fi
          docker pull "$IMAGE"
          docker run --rm --entrypoint /bin/bash "$IMAGE" -s <<'VERIFYEOF'
          set -euo pipefail
          test -s /opt/runtime-distributions.before
          test "$(wc -l < /opt/runtime-distributions.before)" -ge 20
          grep -q "^torch==2.10.0+v0.1.0.ppu2.1.1$" /opt/runtime-distributions.before
          grep -q "^torchvision==0.25.0+v0.1.0.ppu2.1.1$" /opt/runtime-distributions.before
          grep -q "^torchaudio==2.10.0+v0.1.0.ppu2.1.1$" /opt/runtime-distributions.before
          grep -q "^flagtree==0.7.0+ppu3.6$" /opt/runtime-distributions.before
          grep -q "^flag_gems==5.4.0$" /opt/runtime-distributions.before
          grep -q "^numpy==1.26.4$" /opt/runtime-distributions.before
          python - <<'PY'
          import importlib.metadata as m
          from pathlib import Path

          def norm(name):
              return name.lower().replace("_", "-")

          before = {}
          for l in Path("/opt/runtime-distributions.before").read_text().splitlines():
              if l and not l.startswith("#"):
                  name, version = l.split("==", 1)
                  before[norm(name)] = version
          after = {}
          for d in m.distributions():
              name = d.metadata.get("Name")
              if name:
                  after.setdefault(norm(name), (name, d.version))
          drift = [f"{before[k]} -> {after.get(k, ('REMOVED',))[1]}"
                   for k in before if after.get(k, (None, None))[1] != before[k]]
          if drift:
              raise SystemExit("runtime distribution drift:\n" + "\n".join(drift))
          if "triton" in after and "triton" not in before:
              raise SystemExit("standalone triton distribution present")
          allowed = {}
          for path in ("/opt/empty-0.5.18.additions.lock",
                       "/opt/added-distributions.txt"):
              p = Path(path)
              if p.exists():
                  for l in p.read_text().splitlines():
                      if l and not l.startswith("#"):
                          name, version = l.split("==", 1)
                          allowed[norm(name)] = version
          added = {k: after[k][1] for k in set(after) - set(before)}
          uncovered = [f"{after[k][0]}=={v}" for k, v in sorted(added.items())
                       if allowed.get(k) != v]
          if uncovered:
              raise SystemExit("distributions outside lock+ledger:\n"
                               + "\n".join(uncovered))
          print(f"runtime distributions preserved: {len(before)} (zero drift)")
          print(f"additions covered by lock+ledger: {len(added)}")
          print("upgrade/downgrade/replaced/removed: 0/0/0/0")
          import subprocess
          check = subprocess.run(["python", "-m", "pip", "check"],
                                 capture_output=True, text=True)
          allowed_violation = "xgrammar 0.2.1 requires triton, which is not installed."
          violations = [l for l in (check.stdout + check.stderr).splitlines()
                        if l.strip() and l.strip() != allowed_violation]
          if violations:
              raise SystemExit("unexpected pip check violations:\n" + "\n".join(violations))
          print("pip check: clean except the reviewed xgrammar/triton metadata exception")
          assert m.version("sglang") == "0.5.18"
          assert m.version("compressed-tensors") == "0.15.0"
          assert m.version("xgrammar") == "0.2.1"
          assert m.version("loguru") == "0.7.3"
          assert m.version("torchvision") == "0.25.0+v0.1.0.ppu2.1.1"
          assert m.version("torchaudio") == "2.10.0+v0.1.0.ppu2.1.1"
          import torch, xgrammar, loguru, triton
          print("torch", torch.__version__, "| triton from", triton.__file__)
          print("vendor vision/audio import on this device-less runner is "
                "expected to fail and is validated on PPU hardware")
          PY
          VERIFYEOF

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thead-minimal-runtime-image
          path: |
            image-digest.txt
            build-metadata.json
            inspect-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Log out of Harbor
        if: always()
        run: docker logout harbor.baai.ac.cn || true
