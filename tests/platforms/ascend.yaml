# Ascend (Huawei NPU) Platform Configuration
# Flexible test selection mechanism for Huawei Ascend NPU environments.
#
# This file is a starter configuration. Adjust device_types, tolerance, and
# test cases to match your actual Ascend hardware (e.g. 910B/910C) and model
# coverage. Keep this file UTF-8 encoded (no GBK/CP1252) or the loader will
# skip it with a warning.
#
# Users can modify:
# - e2e: Add/remove model cases in inference and serving support lists
# - benchmark: Enable/disable throughput, latency, and serve smoke tests
# - unit: Add/remove paths in include and exclude lists
# - tolerance: Adjust numerical comparison tolerance for result validation
# - unsupported_features: Exclude test cases matching specific feature tags
# - env_defaults: Set HCCL/torch_npu environment defaults before tests start
#
# ---- Platform-level settings ------------------------------------------------
platform: ascend
vendor: huawei

device_types:
  910c:
    memory_gb: 64
    tags: [ascend, bf16, fp16]
  # Add more Ascend devices as needed, e.g.:
  # 910b:
  #   memory_gb: 64
  #   tags: [ascend, bf16, fp16]

# Default numerical tolerance for result comparison.
# Ascend NPU kernels may produce slightly different numerics than CUDA due to
# different accumulation order and kernel implementations; tune per model.
tolerance:
  inference:
    default: {rtol: 1e-5, atol: 1e-8}
    bfloat16: {rtol: 1e-3, atol: 1e-3}
    float16: {rtol: 1e-3, atol: 1e-3}

# Device-level overrides for specific devices or categories.
# Keep as {} if no per-device override is needed.
device_overrides: {}

# Features not supported on this platform.
# Test cases whose model name contains any of these strings will be skipped.
# Common values to consider: ["flashinfer", "triton"] (Ascend uses torch_npu).
unsupported_features: []

# Default environment variables for this platform.
# tests/run.py applies these before invoking pytest.
# Examples for Ascend (uncomment/adjust as needed):
#   HCCL_ALGO: "Ring"
#   HCCL_BUFFSIZE: "200"
env_defaults:
  # v5.3.1 workarounds on Ascend 910C:
  #   mul/index_put_/_index_put_impl_/index: crash/correctness bugs (recursion/segfault/gibberish).
  #   linear: general ops.linear has ~15ms/call per-launch overhead on NPU (vs v5.0.0 ascend addmm
  #     0.16ms) -> decode 0.25 tok/s. Remove `linear` when FlagGems fixes the per-launch overhead.
  #   See docs/ascend-flaggems-v5.3.1-perf-regression.md.
  #   count_nonzero: FlagGems count_nonzero -> dim_compress -> permute(order) builds a 4-dim
  #     order for a 3-dim input (RuntimeError) during eplb expert-location init on MoE models
  #     (Qwen3.6-35B-A3B). Route to native aclnnCountNonzero instead.
  SGLANG_FL_FLAGOS_BLACKLIST: "mul,index_put_,_index_put_impl_,index,linear,count_nonzero"
  # NOTE: ASCEND_LAUNCH_BLOCKING=1 was a temp diagnostic; do NOT re-add it casually: sync
  # mode forces eager kernel compile and triggers "ParseDynamicKernels fail /
  # Cast ADD_TO_LAUNCHER_LIST_AICORE failed" on aclnnInplaceCopy/aclnnReduceSum. Async
  # (default) mode compiles these lazily and avoids the failure.

# ---- Device-specific test configurations ------------------------------------
910c:
  name: "910c"
  tests:
    e2e:
      # Add or remove test cases per model.
      # Each case points to tests/models/<model>/<case>.yaml.
      inference:
        qwen3: ["06b_tp1"]
        # qwen3_6 (hybrid / KDA linear attention) is NOT supported on Ascend yet:
        # chunk_kda's @triton.autotune crashes at import in triton-ascend's
        # AutoTilingTuner, and sgl-kernel-npu has no native chunk_kda kernel.
        # Tracked in PR #57. Standard qwen3 cases below run green.
      serving:
        qwen3: ["4b_tp2"]

    functional:
      # Reserved for future tests/functional_tests support.
      # Current SGLang runner does not consume this section yet.
      include: "*"
      exclude: []

    unit:
      # Include patterns: "*" for all, or list specific paths.
      include: "*"
      # Exclude patterns: empty list or list paths to exclude.
      exclude: []

    benchmark:
      enabled: true
      smoke: ["throughput", "latency", "serve"]
